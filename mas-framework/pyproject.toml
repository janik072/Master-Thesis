[project]
name = "mas-framework"
version = "0.1.0"
description = "Cost-efficient LLM-based multi-agent stakeholder simulation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "litellm>=1.40",
    "typer[all]>=0.12",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
mas = "mas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mas"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
